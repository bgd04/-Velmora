<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Velmora</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">Velmora</a>

    <nav class="navbar">
        <a href="index.html">Site public</a>
    </nav>
</header>

<section class="page-hero">
    <p class="section-subtitle">Administrare</p>
    <h1>Panou administrativ</h1>
</section>

<section class="admin-login-section" id="adminLoginSection">
    <form class="admin-login-form" id="adminLoginForm">
        <h2>Autentificare admin</h2>

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Parolă" required>

        <button type="submit" class="btn btn-primary">Autentificare</button>

        <p class="login-error" id="loginError"></p>
    </form>
</section>

<section class="admin-section hidden" id="adminPanel">
    <div class="admin-panel-header">
        <h2>Rezervări primite</h2>

        <button class="btn btn-secondary" id="logoutAdmin">
            Logout
        </button>
    </div>

    <div class="admin-actions">
        <button class="btn btn-primary" id="clearReservations">
            Șterge toate rezervările
        </button>
    </div>

    <div class="reservations-table" id="reservationsTable"></div>
</section>

<footer class="footer">
    <p>&copy; 2026 Velmora. Toate drepturile rezervate.</p>
</footer>

<div class="confirm-modal hidden" id="deleteModal">
    <div class="confirm-modal-box">
        <p class="section-subtitle">Velmora</p>

        <h2>Ștergere rezervare</h2>

        <p>
            Sigur dorești să ștergi această rezervare?
            Această acțiune nu poate fi anulată.
        </p>

        <div class="confirm-modal-actions">
            <button class="btn btn-secondary" id="cancelDelete">
                Renunță
            </button>

            <button class="btn delete-confirm-btn" id="confirmDelete">
                Șterge
            </button>
        </div>
    </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
