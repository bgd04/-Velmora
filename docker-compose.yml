services:
  app:
    build: .
    container_name: velmora_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - backend/.env

  db:
    image: mysql:8.0
    container_name: velmora_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: velmora_db
    ports:
      - "3307:3306"
    volumes:
      - velmora_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: velmora_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  velmora_mysql_data:
